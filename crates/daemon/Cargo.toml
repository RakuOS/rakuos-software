[package]
name = "rakuos-software-daemon"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "rakuos-software-tray"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rakuos-updates  = { workspace = true }
rakuos-flatpak  = { workspace = true }
rakuos-packages = { workspace = true }
rakuos-appimages = { workspace = true }

# System tray via D-Bus StatusNotifierItem (KDE + GNOME AppIndicator)
ksni = "0.2"

# Badge drawing — SVG rendering + pixel manipulation
resvg = "0.44"
image = { version = "0.25", default-features = false, features = ["png"] }

# Desktop notifications
notify-rust = "4"

# POSIX signal sending (kill UI on Quit)
libc = "0.2"
